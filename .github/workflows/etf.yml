name: ETF Nachricht

name: ETF Tracker

on:
  schedule:
    - cron: "0 6,10,14,18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sende-etf-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance requests
      - run: python etf_nachricht.py
      - name: Zustand zurueckspeichern
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add etf_state.json
          if ! git diff --staged --quiet; then
            git commit -m "Zustand aktualisiert"
            git pull --rebase origin main
            git push
          fi
