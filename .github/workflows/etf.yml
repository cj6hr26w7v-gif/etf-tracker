name: ETF Tracker

on:
  schedule:
    - cron: "58 5,9,13,17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests

      - name: ETF-Tracker ausführen
        run: python etf_nachricht.py

      - name: Änderungen an etf_state.json speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etf_state.json
          git diff --cached --quiet || git commit -m "Update ETF state"
          git push          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etf_state.json
          git diff --cached --quiet || git commit -m "Update ETF state"
          git push
